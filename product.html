<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blue Raspberry - PRIME</title>
    <meta name="description" content="Hydration Blue Raspberry - bold flavor, refresh, replenish, refuel.">
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;700;900&family=Nunito:wght@400;600;700;800&display=swap"
        rel="stylesheet">
    <!-- Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- CSS -->
    <link rel="stylesheet" href="css/style.css">
    <style>
        .product-page-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 60px;
            align-items: center;
            padding: 60px 0;
        }
        .product-gallery {
            background: linear-gradient(135deg, #E0F2FE 0%, #FFFFFF 100%);
            border-radius: 12px;
            padding: 60px;
            display: flex;
            justify-content: center;
        }
        .product-gallery img {
            max-height: 500px;
            transition: transform 0.5s ease;
        }
        .product-gallery:hover img {
            transform: scale(1.05);
        }
        .product-details h1 {
            font-size: 48px;
            margin-bottom: 10px;
        }
        .product-category {
            font-family: var(--font-heading);
            font-weight: 700;
            color: #999;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 20px;
            display: block;
        }
        .product-price-large {
            font-size: 32px;
            font-weight: 900;
            margin-bottom: 30px;
        }
        .product-description {
            font-size: 18px;
            line-height: 1.6;
            color: #444;
            margin-bottom: 40px;
        }
        .quantity-selector {
            display: flex;
            align-items: center;
            gap: 20px;
            margin-bottom: 30px;
        }
        .qty-btn {
            width: 40px;
            height: 40px;
            border: 1px solid var(--border-color);
            background: white;
            cursor: pointer;
            font-size: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 4px;
        }
        @media (max-width: 768px) {
            .product-page-grid {
                grid-template-columns: 1fr;
                gap: 40px;
            }
        }
    </style>
</head>

<body>
    <div class="promo-bar">
        FREE SHIPPING ON ALL ORDERS $60+
    </div>

    <header class="header" id="header">
        <div class="header-left">
            <button class="mobile-menu-btn" aria-label="Menu"><i class="fa-solid fa-bars"></i></button>
            <nav class="nav-links">
                <a href="index.html#hydration" class="nav-link">SHOP</a>
                <a href="about.html" class="nav-link">ABOUT</a>
            </nav>
        </div>

        <div class="header-center">
            <a href="index.html" class="logo">
                <img src="https://drinkprime.com/cdn/shop/files/Prime-Logo_1600x.png?v=1637610173" alt="PRIME"
                    class="logo-img">
            </a>
        </div>

        <div class="header-right">
            <a href="cart.html" class="icon-link cart-icon">
                <svg aria-hidden="true" focusable="false" role="presentation" class="icon icon-cart" viewBox="0 0 64 64"
                    width="22" height="22">
                    <path d="M14 17.44h46.79l-7.94 25.61H20.96l-9.65-35.1H3" fill="none" stroke="currentColor"
                        stroke-miterlimit="10" stroke-width="2.5"></path>
                    <circle cx="27" cy="53" r="2" fill="currentColor"></circle>
                    <circle cx="47" cy="53" r="2" fill="currentColor"></circle>
                </svg>
                <span class="cart-count">0</span>
            </a>
        </div>
    </header>

    <main class="container">
        <div id="product-page-content" class="product-page-grid" style="display: none;">
            <div id="product-gallery" class="product-gallery scroll-reveal">
                <img id="product-image" src="" alt="Product Image">
            </div>
            <div class="product-details scroll-reveal">
                <span id="product-category" class="product-category"></span>
                <h1 id="product-title"></h1>
                <div id="product-price" class="product-price-large"></div>
                <div id="product-description" class="product-description"></div>
                
                <div class="quantity-selector">
                    <button class="qty-btn" onclick="updateQty(-1)">-</button>
                    <span id="qty-val" style="font-weight: 900; font-size: 20px; width: 30px; text-align: center;">1</span>
                    <button class="qty-btn" onclick="updateQty(1)">+</button>
                </div>

                <button class="btn btn-primary btn-large w-100 add-to-cart-btn" style="border-radius: 4px;">ADD TO CART</button>
                
                <div style="margin-top: 40px; padding-top: 30px; border-top: 1px solid var(--border-color);">
                    <h3 id="highlights-title" style="font-size: 14px; margin-bottom: 15px;">PRODUCT HIGHLIGHTS</h3>
                    <ul id="product-highlights" style="color: #666; font-size: 14px; line-height: 2;">
                    </ul>
                </div>
            </div>
        </div>
        <div id="product-not-found" style="display: none; text-align: center; padding: 100px 0;">
            <h1>Product Not Found</h1>
            <p style="margin-bottom: 30px;">Sorry, the product you are looking for does not exist.</p>
            <a href="index.html" class="btn btn-primary">Back to Shop</a>
        </div>
    </main>

    <footer class="footer">
        <div class="container">
            <div class="footer-bottom">
                <div class="footer-socials">
                    <a href="#"><i class="fa-brands fa-instagram"></i></a>
                    <a href="#"><i class="fa-brands fa-tiktok"></i></a>
                    <a href="#"><i class="fa-brands fa-twitter"></i></a>
                </div>
                <div class="footer-legal">
                    <p class="copyright">&copy; 2024 Prime Hydration LLC. All rights reserved.</p>
                </div>
            </div>
        </div>
    </footer>

    <script src="js/products.js"></script>
    <script src="js/main.js"></script>
    <script>
        // Load product data based on ID in URL
        const urlParams = new URLSearchParams(window.location.search);
        const productId = urlParams.get('id');
        
        if (productId && window.productsData && window.productsData[productId]) {
            const product = window.productsData[productId];
            
            // Set basic info
            document.title = `${product.name} - PRIME`;
            document.getElementById('product-title').innerText = product.name;
            document.getElementById('product-category').innerText = product.category;
            document.getElementById('product-price').innerText = product.price;
            document.getElementById('product-description').innerText = product.description;
            document.getElementById('product-image').src = product.image;
            document.getElementById('product-image').alt = product.name;
            document.getElementById('product-gallery').style.background = product.bgColor;
            
            // Set highlights
            const highlightsList = document.getElementById('product-highlights');
            highlightsList.innerHTML = '';
            product.highlights.forEach(highlight => {
                const li = document.createElement('li');
                li.innerHTML = `<i class="fa-solid fa-check" style="color: black; margin-right: 10px;"></i> ${highlight}`;
                highlightsList.appendChild(li);
            });
            
            // Show content
            document.getElementById('product-page-content').style.display = 'grid';

            // DYNAMIC SEO: Inject Meta Description and Schema
            const metaDesc = document.createElement('meta');
            metaDesc.name = 'description';
            metaDesc.content = product.description;
            document.head.appendChild(metaDesc);

            // JSON-LD Product Schema
            const schemaData = {
                "@context": "https://schema.org/",
                "@type": "Product",
                "name": product.name,
                "image": [product.image],
                "description": product.description,
                "sku": productId,
                "brand": {
                    "@type": "Brand",
                    "name": "PRIME"
                },
                "offers": {
                    "@type": "Offer",
                    "url": window.location.href,
                    "priceCurrency": "USD",
                    "price": product.price.replace('$', ''),
                    "availability": "https://schema.org/InStock"
                }
            };
            const script = document.createElement('script');
            script.type = 'application/ld+json';
            script.text = JSON.stringify(schemaData);
            document.head.appendChild(script);
        } else {
            document.getElementById('product-not-found').style.display = 'block';
        }

        let qty = 1;
        function updateQty(delta) {
            qty = Math.max(1, qty + delta);
            document.getElementById('qty-val').innerText = qty;
        }
    </script>
</body>

</html>
