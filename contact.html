<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us - PRIME | Customer Support & Inquiries</title>
    <meta name="description" content="Reach out to PRIME for order support, general inquiries, or partnerships. We are here to help you stay hydrated.">
    <link rel="canonical" href="https://abhishek-maurya2.github.io/Prime/contact.html">
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;700;900&family=Nunito:wght@400;600;700;800&display=swap"
        rel="stylesheet">
    <!-- Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- CSS -->
    <link rel="stylesheet" href="css/style.css">
    <style>
        .contact-form-container {
            max-width: 600px;
            margin: 0 auto;
            padding: 40px 20px;
        }
        .form-group {
            margin-bottom: 25px;
        }
        .form-group label {
            display: block;
            font-family: var(--font-heading);
            font-weight: 700;
            margin-bottom: 8px;
            text-transform: uppercase;
            font-size: 13px;
        }
        .form-control {
            width: 100%;
            padding: 15px;
            border: 1px solid var(--border-color);
            font-family: var(--font-body);
            font-size: 16px;
            border-radius: 4px;
            outline: none;
            transition: border-color 0.3s;
        }
        .form-control:focus {
            border-color: var(--primary-color);
        }
        textarea.form-control {
            height: 150px;
            resize: vertical;
        }
    </style>
</head>

<body>
    <div class="promo-bar">
        FREE SHIPPING ON ALL ORDERS $60+
    </div>

    <header class="header" id="header">
        <div class="header-left">
            <button class="mobile-menu-btn" aria-label="Menu"><i class="fa-solid fa-bars"></i></button>
            <nav class="nav-links">
                <a href="index.html#hydration" class="nav-link">SHOP</a>
                <a href="about.html" class="nav-link">ABOUT</a>
            </nav>
        </div>

        <div class="header-center">
            <a href="index.html" class="logo">
                <img src="https://drinkprime.com/cdn/shop/files/Prime-Logo_1600x.png?v=1637610173" alt="PRIME"
                    class="logo-img">
            </a>
        </div>

        <div class="header-right">
            <a href="cart.html" class="icon-link cart-icon">
                <svg aria-hidden="true" focusable="false" role="presentation" class="icon icon-cart" viewBox="0 0 64 64"
                    width="22" height="22">
                    <path d="M14 17.44h46.79l-7.94 25.61H20.96l-9.65-35.1H3" fill="none" stroke="currentColor"
                        stroke-miterlimit="10" stroke-width="2.5"></path>
                    <circle cx="27" cy="53" r="2" fill="currentColor"></circle>
                    <circle cx="47" cy="53" r="2" fill="currentColor"></circle>
                </svg>
                <span class="cart-count">0</span>
            </a>
        </div>
    </header>

    <main class="container" style="padding-top: 80px; padding-bottom: 80px;">
        <h1 style="font-size: 48px; margin-bottom: 20px; text-align: center;">CONTACT US</h1>
        <p style="text-align: center; color: #666; margin-bottom: 50px;">Have a question? We're here to help.</p>

        <div class="contact-form-container scroll-reveal">
            <form id="contact-form">
                <div class="form-group">
                    <label for="name">Name</label>
                    <input type="text" id="name" class="form-control" placeholder="Your Name" required>
                </div>
                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" class="form-control" placeholder="your@email.com" required>
                </div>
                <div class="form-group">
                    <label for="subject">Subject</label>
                    <select id="subject" class="form-control">
                        <option>General Inquiry</option>
                        <option>Order Support</option>
                        <option>Partnerships</option>
                        <option>Press</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="message">Message</label>
                    <textarea id="message" class="form-control" placeholder="How can we help?" required></textarea>
                </div>
                <button type="submit" class="btn btn-primary w-100 btn-large">SEND MESSAGE</button>
            </form>
        </div>
    </main>

    <footer class="footer">
        <div class="container">
            <div class="footer-bottom">
                <div class="footer-socials">
                    <a href="#"><i class="fa-brands fa-instagram"></i></a>
                    <a href="#"><i class="fa-brands fa-tiktok"></i></a>
                    <a href="#"><i class="fa-brands fa-twitter"></i></a>
                </div>
                <div class="footer-legal">
                    <p class="copyright">&copy; 2024 Prime Hydration LLC. All rights reserved.</p>
                </div>
            </div>
        </div>
    </footer>

    <script src="js/main.js"></script>
    <script>
        document.getElementById('contact-form')?.addEventListener('submit', function(e) {
            e.preventDefault();
            alert('Thank you for your message! Our team will get back to you soon.');
            this.reset();
        });
    </script>
</body>

</html>
